services:
  gbot:
    build: .
    container_name: gbot
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - TZ=Europe/Istanbul
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./workspace:/app/workspace
      - ./config:/app/config:ro
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    container_name: gbot-dashboard
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      gbot:
        condition: service_started
    restart: unless-stopped

  waha:
    image: devlikeapro/waha
    container_name: waha
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
      - WAHA_API_KEY=${WAHA_API_KEY:-changeme-set-in-env}
      - WAHA_API_KEY_EXCLUDE_PATH=health,ping
      - WHATSAPP_RESTART_ALL_SESSIONS=true
      - TZ=Europe/Istanbul
    volumes:
      - waha_sessions:/app/.sessions
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  waha_sessions:
