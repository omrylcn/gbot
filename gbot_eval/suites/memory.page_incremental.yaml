name: memory.page_incremental
description: |
  Faz 22J-A — incremental entity-page update quality. Each case feeds
  an existing four-section page plus 1-3 delta facts and scores the
  LLM's update: did it keep the old text verbatim, cite the new
  fact_ids, move contradicted claims to ## History, and preserve all
  four section headers?
runner: memory_page_incremental
requires_gbot: true
default_max_tokens: 1500
default_temperature: 0.2

cases:
- id: inc01
  _intent: append a new bullet without rewriting anything
  entity: Murat
  aliases: [Murat]
  today: "2026-05-13"
  existing_page_md: |
    ## Lead
    Murat is a software developer who works on the same team as the user. He lives in Ankara and contributes to mobile projects.

    ## Profile
    - Murat works at HangiKredi alongside the user [fact_id:9a2b3c4d]
    - Murat lives in Ankara [fact_id:1e2f3a4b]
    - Murat uses SQLite for personal projects [fact_id:5c6d7e8f]

    ## Interactions
    - 2026-04-10 — Pair-programmed on the auth module [fact_id:aa11bb22]

    ## History
  delta_facts:
  - fact_id: f0030001
    content: Murat is now learning Go to migrate some services
    importance: 0.7
    access_count: 1
  context_facts:
  - fact_id: 9a2b3c4d
    content: Murat works at HangiKredi alongside the user
    importance: 0.9
    access_count: 5
  relations: []
  expected:
    verbatim_substrings:
      - "Murat is a software developer"
      - "lives in Ankara"
      - "works at HangiKredi"
      - "Pair-programmed on the auth module"
    history_substrings: []      # no contradictions
