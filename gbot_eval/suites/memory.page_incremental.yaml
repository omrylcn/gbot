    - Zeynep works at TechCo [fact_id:p1a2b3c5]
    - Zeynep is married to the user [fact_id:p1a2b3c6]

    ## Interactions
    - 2026-04-20 — Birthday celebration [fact_id:p1a2b3c7]

    ## History
  delta_facts:
  - fact_id: f0040001
    content: Zeynep changed jobs to OtherCo (was TechCo)
    importance: 0.9
    access_count: 1
  context_facts:
  - fact_id: p1a2b3c6
    content: Zeynep is married to the user
    importance: 1.0
    access_count: 9
  relations: []
  expected:
    verbatim_substrings:
      - "Zeynep is the user's partner"
      - "lives in Pendik"
      - "married to the user"
    history_substrings:
      - "TechCo"        # the old claim must end up in History
