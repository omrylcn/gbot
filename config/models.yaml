# Model registry — per-model defaults for both production gbot and
# gbot-eval. Single source of truth for thinking mode, max_tokens,
# pricing, and OpenRouter reasoning param.
#
# Lookup priority at call time:
#   caller arg  >  models[<id>]  >  defaults  >  hard-coded fallback
#
# Pricing is USD per 1M tokens. Updated via `gbot-eval models add` or
# `gbot-eval models refresh`. Stay tidy here; user-only overrides land in
# `gbot_eval/output/pricing_overrides.json` (gitignored).

last_updated: "2026-05-10"

defaults:
  thinking: false              # false → no `reasoning` parameter sent
  reasoning_effort: null       # null = unset; "none" = explicitly disable
  max_tokens: 4096
  temperature: 0.7
  pricing:
    prompt: 0.0                # $/1M tokens — 0 reports cost=0 with warning
    completion: 0.0

models:
  # ── Google ─────────────────────────────────────────────
  openrouter/google/gemini-3-flash-preview:
    thinking: false
    pricing: { prompt: 0.075, completion: 0.30 }
    notes: "Production default — fast, cheap, non-reasoning"

  openrouter/google/gemini-3.1-flash-lite:
    thinking: false
    pricing: { prompt: 0.05, completion: 0.20 }

  openrouter/google/gemini-2.5-flash:
    thinking: false
    pricing: { prompt: 0.075, completion: 0.30 }

  openrouter/google/gemini-2.5-pro:
    thinking: false
    pricing: { prompt: 1.25, completion: 10.00 }

